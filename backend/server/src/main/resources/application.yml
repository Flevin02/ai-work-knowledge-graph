server:
  port: ${SERVER_PORT:4010}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}

spring:
  application:
    name: ai-work-knowledge-graph-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:knowledge_graph}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # MySQL 使用服务端并发控制；连接池只限制应用侧资源占用。
      pool-name: knowledge-graph-mysql
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:10}
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:2}
      connection-timeout: ${MYSQL_POOL_CONNECTION_TIMEOUT_MS:3000}
      initialization-fail-timeout: ${MYSQL_POOL_INITIALIZATION_FAIL_TIMEOUT_MS:3000}
  profiles:
    active: @profile.active@
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    async:
      # SSE 允许多分片串行模型调用；单次模型超时仍由 AI_TIMEOUT_SECONDS 独立控制。
      request-timeout: ${AI_STREAM_REQUEST_TIMEOUT_MS:300000}
  jackson:
    default-property-inclusion: non_null

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3010}
  # 原始文件仍落在本地目录，事实元数据和审核记录统一保存到 MySQL。
  upload-dir: ${UPLOAD_DIR:./backend/server/data/uploads}

ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:openai-compatible}
  model: ${AI_MODEL:gpt-5.5}
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://api.psydo.top/v1}
  json-schema-enabled: ${AI_JSON_SCHEMA_ENABLED:false}
  embedding-enabled: ${AI_EMBEDDING_ENABLED:false}
  embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
  prompt-version: ${AI_PROMPT_VERSION:prd-extraction-v3}
  summary-prompt-version: ${AI_SUMMARY_PROMPT_VERSION:document-summary-v1}
  schema-version: ${AI_SCHEMA_VERSION:extraction-v2}
  temperature: ${AI_TEMPERATURE:0.0}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:4096}
  max-retries: ${AI_MAX_RETRIES:0}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  batch-extraction:
    # 多选提取在后端使用有界线程池执行，避免同时占满模型请求和 MySQL 写入资源。
    max-concurrency: ${AI_BATCH_EXTRACTION_MAX_CONCURRENCY:2}
    queue-capacity: ${AI_BATCH_EXTRACTION_QUEUE_CAPACITY:12}
  rag:
    section-parser-version: ${AI_RAG_SECTION_PARSER_VERSION:prd-markdown-section-v1}
    chunk-strategy-version: ${AI_RAG_CHUNK_STRATEGY_VERSION:section-aware-v1}
    max-chunk-chars: ${AI_RAG_MAX_CHUNK_CHARS:1500}
    overlap-chars: ${AI_RAG_OVERLAP_CHARS:150}
    top-k: ${AI_RAG_TOP_K:5}
    min-score: ${AI_RAG_MIN_SCORE:0.70}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match:
        - /**
      packages-to-scan:
        - com.flevin.knowgraph.server.controller

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false

knife4j:
  enable: true
  setting:
    language: zh_cn
