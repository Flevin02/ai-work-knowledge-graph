server:
  port: ${SERVER_PORT:4010}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}

spring:
  application:
    name: ai-work-knowledge-graph-backend
  datasource:
    url: jdbc:sqlite:${app.database-path}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # 本地 SQLite 仍保持单写；连接池只限制资源并支持并发读取。
      pool-name: knowledge-graph-sqlite
      maximum-pool-size: ${SQLITE_POOL_MAX_SIZE:4}
      minimum-idle: ${SQLITE_POOL_MIN_IDLE:1}
      connection-timeout: ${SQLITE_POOL_CONNECTION_TIMEOUT_MS:3000}
      initialization-fail-timeout: ${SQLITE_POOL_CONNECTION_TIMEOUT_MS:3000}
      data-source-properties:
        "[journal_mode]": WAL
        "[foreign_keys]": true
        "[busy_timeout]": ${SQLITE_BUSY_TIMEOUT_MS:5000}
  profiles:
    active: @profile.active@
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    async:
      # SSE 允许多分片串行模型调用；单次模型超时仍由 AI_TIMEOUT_SECONDS 独立控制。
      request-timeout: ${AI_STREAM_REQUEST_TIMEOUT_MS:300000}
  jackson:
    default-property-inclusion: non_null

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3010}
  # 相对路径以 backend/server 作为启动工作目录；可通过 DATA_DIR 或单独路径变量覆盖。
  data-dir: ${DATA_DIR:./data}
  database-path: ${DATABASE_PATH:${app.data-dir}/knowledge-graph.sqlite}
  upload-dir: ${UPLOAD_DIR:${app.data-dir}/uploads}

ai:
  enabled: ${AI_ENABLED:true}
  provider: ${AI_PROVIDER:openai-compatible}
  model: ${AI_MODEL:gpt-5.4-mini}
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://api.psydo.top/v1}
  json-schema-enabled: ${AI_JSON_SCHEMA_ENABLED:true}
  embedding-enabled: ${AI_EMBEDDING_ENABLED:true}
  embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
  prompt-version: ${AI_PROMPT_VERSION:prd-extraction-v2}
  schema-version: ${AI_SCHEMA_VERSION:extraction-v2}
  temperature: ${AI_TEMPERATURE:0.0}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:4096}
  max-retries: ${AI_MAX_RETRIES:0}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  batch-extraction:
    # 多选提取在后端使用有界线程池执行，避免同时占满模型请求和 SQLite 写入资源。
    max-concurrency: ${AI_BATCH_EXTRACTION_MAX_CONCURRENCY:2}
    queue-capacity: ${AI_BATCH_EXTRACTION_QUEUE_CAPACITY:12}
  rag:
    max-chunk-chars: ${AI_RAG_MAX_CHUNK_CHARS:1500}
    overlap-chars: ${AI_RAG_OVERLAP_CHARS:150}
    top-k: ${AI_RAG_TOP_K:5}
    min-score: ${AI_RAG_MIN_SCORE:0.70}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match:
        - /**
      packages-to-scan:
        - com.flevin.knowgraph.server.controller

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false

knife4j:
  enable: true
  setting:
    language: zh_cn
